[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-simple-url-shortner"
version = "0.2.2"
description = "A small, self-hosted Django URL shortener."
readme = "README.md"
requires-python = ">=3.12,<3.16"
license = "GPL-2.0-only"
license-files = ["LICENSE"]
dependencies = ["Django>=6.1.3,<6.2"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]

[project.urls]
Homepage = "https://github.com/ricardodani/django-simple-url-shortner"
Repository = "https://github.com/ricardodani/django-simple-url-shortner"
Issues = "https://github.com/ricardodani/django-simple-url-shortner/issues"

[project.optional-dependencies]
dev = [
    "build",
    "coverage[toml]",
    "django-stubs[compatible-mypy]",
    "playwright",
    "pre-commit",
    "pytest",
    "pytest-django",
    "ruff",
    "twine",
]

[tool.setuptools]
package-dir = {"" = "simple_url_shortner"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["simple_url_shortner"]
include = ["urlshortener*"]
exclude = ["urlshortener.tests*"]

[tool.setuptools.package-data]
urlshortener = [
    "py.typed",
    "licenses/*.txt",
    "templates/**/*.html",
    "static/**/*",
]

[tool.ruff]
line-length = 88
target-version = "py312"
force-exclude = true
exclude = ["simple_url_shortner/urlshortener/migrations"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.coverage.run]
branch = true
source = ["urlshortener"]

[tool.coverage.report]
show_missing = true

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
mypy_path = ["simple_url_shortner"]
files = ["simple_url_shortner/urlshortener"]
exclude = ["migrations", "test_.*\\.py$"]
check_untyped_defs = true
disallow_untyped_defs = true

[tool.django-stubs]
django_settings_module = "simple_url_shortner.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "simple_url_shortner.settings"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -p no:anyio"
