{% extends "base.html" %}
{% load static %}
{% block extra_head %}
    <link href="{% static "urlshortener/css/formpage.css" %}" rel="stylesheet">
{% endblock %}
{% block navbar %}
{% endblock %}

{% block content %}
    <form class="user-form" action="{% url 'login' %}" method="POST">
        <h2 class="user-form-heading">Login</h2>
        {% csrf_token %}
        {% include "meta/bootstraped_form.html" with form=form %}
        <button class="btn btn-lg btn-primary w-100 mb-2" type="submit">Login</button>
        <button class="btn btn-lg btn-outline-secondary w-100" type="button" data-bs-toggle="modal" data-bs-target="#modal-register">...or Register</button>
    </form>
{% include "register-modal.html" %}
{% endblock %}
