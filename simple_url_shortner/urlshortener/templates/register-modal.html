{% if user_register_form %}
<div class="modal fade" id="modal-register" tabindex="-1" aria-labelledby="modal-register-title" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <form class="form-signin" action="{% url 'register' %}" method="POST">
        {% csrf_token %}
        <div class="modal-header">
          <h2 class="modal-title fs-5" id="modal-register-title">Register</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          {% include "meta/bootstraped_form.html" with form=user_register_form %}
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          <button type="submit" class="btn btn-primary">Register</button>
        </div>
      </form>
    </div><!-- /.modal-content -->
  </div><!-- /.modal-dialog -->
</div><!-- /.modal -->
{% endif %}
