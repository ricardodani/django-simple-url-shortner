{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Django Simple URL Shortener</title>

    <link href="{% static "urlshortener/css/bootstrap.min.css" %}" rel="stylesheet">
    {% block extra_head %}
    {% endblock %}
  </head>

  <body>
    {% block navbar %}
    {% include "navbar.html" %}
    {% endblock %}
    <main class="container py-5 mt-5">
      {% if messages %}
        {% for message in messages %}
          <div class="alert alert{% if message.tags %}-{{ message.tags }}{% endif %}" role="alert">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}
      {% block content %}
      {% endblock %}
    </main>
    <script src="{% static "urlshortener/js/bootstrap.bundle.min.js" %}"></script>
  </body>
</html>
